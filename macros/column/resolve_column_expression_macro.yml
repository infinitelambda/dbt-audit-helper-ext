macros:
  - name: resolve_column_expression_macro
    description: |
      Dynamically resolve and execute a column expression macro.

      This macro looks up a transformation macro by name and applies it to a column,
      returning the transformed SQL expression.

      The built-in `audit_helper__*` expressions are resolved through the audit_helper_ext
      namespace; any other name is treated as a macro in your own project. The column name is
      quoted before it reaches the expression macro, so expressions receive a ready-to-use
      identifier.

      An unknown macro name fails at compile time with dbt's own "No macro named ... found
      within namespace" error — there is no silent fallback to the untransformed column, since
      that would quietly compare the wrong thing.

      Example:
      ```sql
      {% raw %}
      {% set expression = audit_helper_ext.resolve_column_expression_macro(
          column_name='price',
          macro_name='round_2dp_expr'
      ) %}
      {% endraw %}
      -- Returns: round("price", 2)
      ```

    arguments:
      - name: column_name
        type: string
        description: The name of the column to apply the expression to
      - name: macro_name
        type: string
        description: The name of the macro to execute (e.g., 'round_2dp_expr')
