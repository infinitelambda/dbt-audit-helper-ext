macros:
  - name: build_conflicts_projection
    description: |
      Build the CSV projection used by `show_columns_conflicts_sql` for both sides of the
      comparison, applying any custom column expressions configured on the model.

      Unlike `build_filtered_query`, the conflicts path compares an explicit caller-supplied
      subset of columns while `get_column_specs` returns specs for the whole relation, so
      specs are matched to the requested columns by name (case-insensitively) rather than
      projected wholesale. Columns without a matching spec keep their bare identifier: the
      downstream pivot derives `<column>__a` / `<column>__b` aliases from the raw name, and
      an expression's `… as "column"` alias is what keeps those references resolving.

      **Returns** (`string`): the comma-separated projection, e.g. `id,round("amount", 2) as "amount"`.

    arguments:
      - name: columns
        type: list[string]
        description: Column names to project, typically `primary_keys` + `columns_to_compare`.
      - name: column_specs
        type: optional[list]
        description: |
          Column specs from `get_column_specs`. When omitted or empty, `columns` are joined
          as-is — the raw comparison behaviour.
