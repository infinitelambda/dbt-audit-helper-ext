macros:
  - name: show_columns_conflicts_sql
    description: |
      This macro does a comparison of columns' values in two relations. This macro is useful after you've run `audit_helper.compare_all_columns` and you want to dive deeper the different values and where the difference is.

      ## Output

      Be default, the generated query returns a summary of the count of conflicting values.

      | store_name__a  | store_name__b  | count_conflicts |
      | -------------- | -------------- | --------------- |
      | Jaffle         | JAFFLE         |               2 |
      | kika store     | KIKA STORE     |               1 |

      Setting the `summarize` argument to `false` lets you see the specific row with primary key.

      | id                                   | store_name  |  in_a |  in_b |
      | ------------------------------------ | ----------- | ----- | ----- |
      | 00098740-d7dc-453f-878b-f7e5d58ed908 | JAFFLE      | False |  True |
      | 00098740-d7dc-453f-878b-f7e5d58ed908 | Jaffle      |  True | False |
      | 001c128a-5248-40d2-80ed-7bfd067dc524 | JAFFLE      | False |  True |
      | 001c128a-5248-40d2-80ed-7bfd067dc524 | Jaffle      |  True | False |
      | 001d3e4d-bb1f-4f31-a244-aed39b5555e0 | KIKA STORE  | False |  True |
      | 001d3e4d-bb1f-4f31-a244-aed39b5555e0 | kika store  |  True | False |

      ## Usage

      {% raw %}

      ```sql

      {% set old_relation = adapter.get_relation(
            database = "old_database",
            schema = "old_schema",
            identifier = "fct_orders"
      ) -%}

      {% set dbt_relation = ref('fct_orders') %}

      {{ audit_helper_ext.show_columns_conflicts_sql(
          a_relation = old_relation,
          b_relation = dbt_relation,
          primary_keys = 'id',
          columns_to_compare = 'order_total'
      ) }}

      ```

      {% endraw %}

    arguments:
      - name: a_relation
        type: relation
        description: The source relation to compare.
      - name: b_relation
        type: relation
        description: The dbt relation to compare against.
      - name: primary_keys
        type: string | list[string]
        description: |
          The primary key of the model. Used to sort unmatched results for row-by-row validation.
          Must be unique and never null in both relations, otherwise the join won't work as
          expected. Accepts `column_a`, `column_a,column_b`, or `["column_a", "column_b"]`.
      - name: columns_to_compare
        type: string | list[string]
        description: |
          Columns you want to see the conflicting values for. Accepts `column_a`,
          `column_a,column_b`, or `["column_a", "column_b"]`.
      - name: summarize
        type: optional[bool]
        description: Switch between a summary and a detailed view of the compared data. Defaults to true.
      - name: limit
        type: optional[int]
        description: Limit the number of rows returned. Defaults to none.
      - name: a_filter
        type: optional[string]
        description: WHERE clause applied to the source side before comparing.
      - name: b_filter
        type: optional[string]
        description: WHERE clause applied to the dbt side before comparing.
      - name: column_specs
        type: optional[list]
        description: |
          Column specs from `audit_helper_ext.get_column_specs`, used to project columns through
          the expressions configured in `audit_helper__custom_column_expressions`. Specs may cover
          the whole relation; only those matching `primary_keys` + `columns_to_compare` are
          applied. Defaults to none, which compares the columns untransformed.
